# Application configuration defaults for the Solo-Lite auto-trading stack.
# Values here can be overridden via environment variables (see .env.template).

symbols:
  - "BTC/USDT"
  - "ETH/USDT"

exchange:
  id: "binance"
  default_order_size: 0.01
  enable_live_trading: false
  sandbox_mode: true
  api_key: ""
  api_secret: ""
  api_password: ""

notifications:
  alert_chat_id:
  report_chat_id:

strategy:
  # Time frame mapping
  timeframes:
    trend: "1d"
    entry: "1h"

  # Volume confirmation settings
  volume_confirmation:
    enabled: true
    ma_period: 20
    multiplier: 1.5

  # Retest definition (as a descriptive string/flag)
  retest_rule:
    success_condition: "candle_close_confirmation"

  # Stop-loss, take-profit, and trailing stop settings
  risk_management:
    stop_loss_method: "atr"
    atr_period: 14
    atr_multiplier: 2.0
    atr_take_profit_r_multiple: 2.0
    percentage_sl: 3.0
    account_equity_usd: 10000.0

  # Default risk ratio per trade (percentage)
  default_risk:
    ratio: 1.0

  # Signal confidence and cooldown
  signal_confidence:
    threshold: 0.7
    cooldown_seconds: 3600

  # Moving average crossover settings
  moving_average:
    fast_period: 9
    slow_period: 21
    trend_period: 200

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  volume_breakout:
    lookback: 20
    volume_ma_period: 20
    volume_multiplier: 2.0
    breakout_buffer_pct: 0.001

  divergence:
    rsi_period: 14
    window: 20
    bullish_rsi_floor: 30.0
    bearish_rsi_ceiling: 70.0
    min_price_change_pct: 0.003
    min_rsi_change: 3.0

  retest:
    lookback: 30
    tolerance_pct: 0.002
    confirmation_bars: 3

  switches:
    ema_trend_pullback: true
    volume_breakout: true
    rsi_divergence: true
    breakout_retest: true
    macd_crossover: false

  # Position sizing controls
  position_sizing:
    account_equity_usd: 10000.0
    risk_per_trade_percent: 1.0
    max_position_notional_usd: 500.0
    min_position_notional_usd: 10.0
